name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned to full commit SHAs: a tag can be moved, a commit can't.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run vectors -- --check
      - run: npm run coverage # the unit tests, failing if coverage drops below the thresholds in vite.config.ts
      - run: npm run build
      - run: npm run tdp -- verify samples/sample.tdp --trust samples/trust-store.json
      - run: npm run lab
      - run: git diff --exit-code -- samples/lab ':!samples/lab/demo-results.*' ':!samples/lab/evidence-bundle-SN-0001.json' ':!samples/lab/evidence-bundle-SN-0001.signed.json'
      - run: npm run tdp -- record verify samples/lab/ledgers/SN-0001.ledger.json --package samples/lab/SYN-PH-2000_A.tdp --trust samples/lab/trust-store.signed.json --anchors samples/lab/anchors.json --authority samples/lab/authority.signed.json --process samples/lab/processes/printed-part-v1.json --evidence-dir samples/lab/evidence --checkpoint samples/lab/ledgers/SN-0001.checkpoint.json --at 2026-11-12T13:00:00Z
      - run: npm run e2e
